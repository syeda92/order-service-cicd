name: Order Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t order-service:${{ github.sha }} .

      - name: Test image runs
        run: |
          docker run -d -p 5000:5000 --name test-container order-service:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop test-container

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag order-service:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}
          docker tag order-service:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

      - name: Update Helm values with new image tag
        run: |
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" order-service-chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add order-service-chart/values.yaml
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
          git push
